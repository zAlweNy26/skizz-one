name: CI

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - '.*/**'
  workflow_call:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bunx fallow dead-code
      - run: bunx fallow dupes
      - run: bunx nuxi typecheck
      - run: bunx tsc -p realtime
      - run: bunx vitest run
      - name: fallow health (report only)
        run: bunx fallow health --coverage coverage/coverage-final.json
        continue-on-error: true
      - name: fallow audit (fails only on what the PR introduces)
        if: github.event_name == 'pull_request'
        run: bunx fallow audit --coverage coverage/coverage-final.json --changed-since origin/${{ github.base_ref }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
