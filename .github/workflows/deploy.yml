name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.*/**'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://skizz.app
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Deploy the realtime worker
        run: bun run deploy:realtime
      - name: Build the app
        run: bun run build
      - name: Deploy the app
        run: bunx wrangler deploy --cwd .output
